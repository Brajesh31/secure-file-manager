name: Bug report
description: Report a reproducible issue in the file manager UI.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Affected route
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or sanitized console output
