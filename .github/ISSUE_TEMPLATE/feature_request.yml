name: Feature request
description: Suggest a UI, data, backend or security improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem and context
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: architecture
    attributes:
      label: Routes, data and API impact
      description: Clarify whether the request is UI-only or requires a trusted backend capability.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and privacy impact
      description: Include identity, authorization, file handling, storage, logging and retention.
